name: Documentation

on:
    pull_request:
        paths:
            - '**/*.md'
            - '.github/workflows/docs.yml'
    push:
        branches:
            - main
        paths:
            - '**/*.md'
            - '.github/workflows/docs.yml'

permissions:
    contents: read

concurrency:
    group: documentation-${{ github.ref }}
    cancel-in-progress: true

jobs:
    markdown:
        name: Markdown lint
        runs-on: ubuntu-latest

        steps:
            - name: Checkout repository
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

            - name: Set up Node.js
              uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
              with:
                  node-version: '22'

            - name: Install markdownlint
              run: npm install --global markdownlint-cli2

            - name: Check Markdown files
              run: |
                  markdownlint-cli2 \
                    "**/*.md" \
                    "#node_modules"

    links:
        name: Check links
        runs-on: ubuntu-latest

        steps:
            - name: Checkout repository
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

            - name: Check documentation links in pull request
              if: github.event_name == 'pull_request'
              uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2
              with:
                  args: >-
                      --verbose
                      --no-progress
                      --accept 200,204,206,429
                      --exclude '^https://github\.com/Denki77/metricshell/actions/workflows/release\.yml/badge\.svg$'
                      "./**/*.md"
                  fail: true

            - name: Check documentation links after merge
              if: github.event_name == 'push'
              uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2
              with:
                  args: >-
                      --verbose
                      --no-progress
                      --accept 200,204,206,429
                      "./**/*.md"
                  fail: true

    secrets:
        name: Secret scan
        runs-on: ubuntu-latest

        steps:
            - name: Checkout full repository history
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
              with:
                  fetch-depth: 0

            - name: Scan repository for secrets
              uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
