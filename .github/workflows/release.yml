name: Release

on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]

permissions:
  contents: read

jobs:
  action-pins:
    name: Verify external action availability
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # Bootstrap without actions: an invalid action SHA must not prevent this check.
      - name: Fetch workflow sources
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git init .
          git remote add origin "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}.git"
          auth=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)
          git -c "http.extraHeader=AUTHORIZATION: basic $auth" fetch --depth=1 origin "$GITHUB_SHA"
          git checkout --detach FETCH_HEAD
      - name: Check external action commits and entrypoints
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 -m unittest discover -s .github/scripts -p 'test_*.py'
          python3 .github/scripts/verify-actions.py

  production-gate:
    needs: action-pins
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Reject tag/version mismatch before validation
        run: test "${GITHUB_REF_NAME}" = "v$(cat VERSION)"
      - name: Full mandatory production validation
        working-directory: implementation
        run: make production-gate REVISION=${GITHUB_SHA} IMAGE=metricshell-release-gate

  publish:
    needs: production-gate
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
      packages: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1
      - uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Validate release identity and build binaries
        working-directory: implementation
        run: |
          test "${GITHUB_REF_NAME}" = "v$(cat ../VERSION)"
          make release REVISION=${GITHUB_SHA}
          ./scripts/verify-release-version.sh
      - name: Generate signed supply-chain release material
        env:
          RELEASE_SIGNING_KEY: ${{ secrets.RELEASE_SIGNING_KEY }}
          RELEASE_SIGNING_PUBLIC_KEY: ${{ vars.RELEASE_SIGNING_PUBLIC_KEY }}
        working-directory: implementation
        run: |
          test -n "$RELEASE_SIGNING_KEY"
          test -n "$RELEASE_SIGNING_PUBLIC_KEY"
          umask 077
          printf '%s' "$RELEASE_SIGNING_KEY" > "$RUNNER_TEMP/release-key.hex"
          printf '%s' "$RELEASE_SIGNING_PUBLIC_KEY" > "$RUNNER_TEMP/release-public.hex"
          make supply-chain REVISION=${GITHUB_SHA} IMAGE=metricshell-release \
            RELEASE_SIGNING_KEY_FILE="$RUNNER_TEMP/release-key.hex" \
            RELEASE_SIGNING_PUBLIC_KEY_FILE="$RUNNER_TEMP/release-public.hex"
          rm -f "$RUNNER_TEMP/release-key.hex" "$RUNNER_TEMP/release-public.hex"
      - name: Independently verify files delivered to consumers
        working-directory: implementation
        run: |
          cd dist/supply-chain/release
          sha256sum -c SHA256SUMS
          expected="metricshell version=$(cat "$GITHUB_WORKSPACE/VERSION") revision=${GITHUB_SHA}"
          actual="$(./metricshell-linux-amd64 --version)"
          test "$actual" = "$expected"
      - name: Publish official multi-architecture images
        id: image
        working-directory: implementation
        env:
          REGISTRY: ghcr.io/${{ github.repository_owner }}
        run: |
          version=$(cat ../VERSION)
          docker buildx build --platform linux/amd64,linux/arm64 --target runtime \
            --build-arg VERSION="$version" --build-arg REVISION="${GITHUB_SHA}" \
            --tag "${REGISTRY,,}/metricshell:$version" --tag "${REGISTRY,,}/metricshell-artifact:$version" \
            --metadata-file "$RUNNER_TEMP/image-metadata.json" --push -f Dockerfile ..
          digest=$(jq -r '."containerimage.digest"' "$RUNNER_TEMP/image-metadata.json")
          test -n "$digest" && test "$digest" != null
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
          docker buildx build --platform linux/amd64,linux/arm64 \
            --build-arg METRICSHELL_IMAGE_REF="${REGISTRY,,}/metricshell@${digest}" \
            --tag "${REGISTRY,,}/metricshell-example:$version" \
            --metadata-file "$RUNNER_TEMP/example-image-metadata.json" --push \
            -f examples/docker/base-image/Dockerfile examples/docker/base-image
          example_digest=$(jq -r '."containerimage.digest"' "$RUNNER_TEMP/example-image-metadata.json")
          test -n "$example_digest" && test "$example_digest" != null
          echo "example_digest=$example_digest" >> "$GITHUB_OUTPUT"
          printf 'metricshell=%s/metricshell@%s\nartifact=%s/metricshell-artifact@%s\nexample=%s/metricshell-example@%s\n' \
            "${REGISTRY,,}" "$digest" "${REGISTRY,,}" "$digest" "${REGISTRY,,}" "$example_digest" \
            > dist/supply-chain/release/OCI_DIGESTS
      - name: Render deployable Kubernetes release bundle
        working-directory: implementation
        run: |
          ./scripts/render-kubernetes-release.sh '${{ steps.image.outputs.example_digest }}' dist/kubernetes-release
          tar -C dist -czf dist/supply-chain/release/metricshell-kubernetes-${GITHUB_REF_NAME}.tar.gz kubernetes-release
      - name: Generate GitHub artifact attestations
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8
        with:
          subject-path: implementation/dist/supply-chain/release/metricshell-linux-*
      - name: Publish immutable GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          version=$(cat VERSION)
          test "$GITHUB_REF_NAME" = "v$version"
          gh release create "$GITHUB_REF_NAME" implementation/dist/supply-chain/release/* \
            --verify-tag --title "MetricShell $version" --generate-notes \
            --notes "MetricShell OCI digest: ${{ steps.image.outputs.digest }}
          Example workload OCI digest: ${{ steps.image.outputs.example_digest }}"
