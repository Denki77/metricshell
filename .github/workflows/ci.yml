name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  action-pins:
    name: Verify external action availability
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # Bootstrap without actions: an invalid action SHA must not prevent this check.
      - name: Fetch workflow sources
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git init .
          git remote add origin "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}.git"
          auth=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)
          git -c "http.extraHeader=AUTHORIZATION: basic $auth" fetch --depth=1 origin "$GITHUB_SHA"
          git checkout --detach FETCH_HEAD
      - name: Check external action commits and entrypoints
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 -m unittest discover -s .github/scripts -p 'test_*.py'
          python3 .github/scripts/verify-actions.py

  implementation:
    needs: action-pins
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Mandatory production release gate
        working-directory: implementation
        shell: bash
        run: |
          log_file="$(mktemp)"
          trap 'rm -f "$log_file"' EXIT
          set +e
          make production-gate REVISION=${{ github.sha }} IMAGE=metricshell-ci 2>&1 | tee "$log_file"
          status=${PIPESTATUS[0]}
          set -e
          if [[ "$status" -ne 0 ]]; then
            message="$(tail -n 25 "$log_file" | sed -e 's/%/%25/g' -e 's/\r/%0D/g' -e ':a;N;$!ba;s/\n/%0A/g')"
            echo "::error title=Production release gate failed::$message"
          fi
          exit "$status"
