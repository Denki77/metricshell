name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  implementation:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Mandatory production release gate
        working-directory: implementation
        run: make production-gate REVISION=${{ github.sha }} IMAGE=metricshell-ci
