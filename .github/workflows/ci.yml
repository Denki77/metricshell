name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  implementation:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Test and build in Docker
        working-directory: implementation
        run: make ci REVISION=${{ github.sha }} IMAGE=metricshell-ci
