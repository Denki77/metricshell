name: Bug report
description: Report reproducible MetricShell behavior that appears incorrect.
title: "Bug: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug. Please include enough Docker-based detail for reproduction.
  - type: input
    id: version
    attributes:
      label: Version or commit
      placeholder: "0.1.2-dev / commit SHA"
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction
      description: Prefer Docker commands, compose snippets or Kubernetes manifests.
      render: sh
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs or metrics
      render: text
